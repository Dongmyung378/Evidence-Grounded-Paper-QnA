<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title description">
  <title id="title">Evidence-grounded paper Q&amp;A pipeline</title>
  <desc id="description">A text-based English PDF is divided into page-aware chunks. BM25 and multilingual E5 retrieval are combined by reciprocal rank fusion, followed by multilingual cross-encoder reranking, evidence checks, extractive answers or Korean translation, and traceable citations. This diagram describes the implemented pipeline and makes no performance claim.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#243F58" stroke-width="1.6"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { fill: #243F58; }
      .quiet { fill: #666862; }
      .copper { fill: #AE7446; }
      .stage { fill: #FFFFFF; stroke: #D5D4CD; stroke-width: 1.5; }
      .detail { fill: #565D61; font-size: 18px; }
      .stage-title { fill: #243F58; font-size: 27px; font-weight: 700; }
      .flow { fill: none; stroke: #243F58; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="800" fill="#F7F6F2"/>
  <rect x="80" y="70" width="56" height="4" fill="#AE7446"/>
  <text x="152" y="79" class="copper" font-size="17" letter-spacing="2.5">RESEARCH PAPER Q&amp;A</text>
  <text x="80" y="150" class="ink" font-size="49" font-weight="700">Evidence-grounded paper Q&amp;A</text>
  <text x="80" y="193" class="quiet" font-size="23">From one English PDF to answers with inspectable source locations</text>
  <path d="M80 224H1320" stroke="#D5D4CD" stroke-width="1"/>

  <rect x="412" y="259" width="256" height="58" fill="#ECEFEF" stroke="#C7CDD0" stroke-width="1.2"/>
  <text x="540" y="294" text-anchor="middle" class="ink" font-size="18">English or Korean question</text>
  <path class="flow" d="M540 317V369"/>

  <rect x="80" y="379" width="280" height="245" class="stage"/>
  <rect x="80" y="379" width="280" height="5" fill="#243F58"/>
  <text x="104" y="423" class="copper" font-size="16" letter-spacing="2">SOURCE</text>
  <text x="104" y="468" class="stage-title">PDF &amp; chunks</text>
  <text x="104" y="511" class="detail">Pages and sections</text>
  <text x="104" y="543" class="detail">Overlapping passages</text>
  <text x="104" y="575" class="detail">Source identifiers</text>

  <path class="flow" d="M368 501H388"/>
  <rect x="400" y="379" width="280" height="245" class="stage"/>
  <rect x="400" y="379" width="280" height="5" fill="#243F58"/>
  <text x="424" y="423" class="copper" font-size="16" letter-spacing="2">RETRIEVE</text>
  <text x="424" y="468" class="stage-title">Hybrid retrieval</text>
  <text x="424" y="511" class="detail">BM25 + multilingual E5</text>
  <text x="424" y="543" class="detail">Reciprocal rank fusion</text>
  <text x="424" y="575" class="detail">Fused candidates (RRF)</text>

  <path class="flow" d="M688 501H708"/>
  <rect x="720" y="379" width="280" height="245" class="stage"/>
  <rect x="720" y="379" width="280" height="5" fill="#243F58"/>
  <text x="744" y="423" class="copper" font-size="16" letter-spacing="2">RANK</text>
  <text x="744" y="468" class="stage-title">Reranking</text>
  <text x="744" y="511" class="detail">Multilingual</text>
  <text x="744" y="543" class="detail">cross-encoder</text>
  <text x="744" y="575" class="detail">Ranked source passages</text>

  <path class="flow" d="M1008 501H1028"/>
  <rect x="1040" y="379" width="280" height="245" class="stage"/>
  <rect x="1040" y="379" width="280" height="5" fill="#AE7446"/>
  <text x="1064" y="423" class="copper" font-size="16" letter-spacing="2">ANSWER</text>
  <text x="1064" y="464" class="ink" font-size="26" font-weight="700">Grounded answers</text>
  <text x="1064" y="496" class="ink" font-size="26" font-weight="700">+ citations</text>
  <text x="1064" y="538" class="detail">Evidence and refusal checks</text>
  <text x="1064" y="570" class="detail">Extract or translate</text>
  <text x="1064" y="602" class="detail">Page, section and chunk IDs</text>

  <path d="M80 669H1320" stroke="#D5D4CD" stroke-width="1"/>
  <text x="80" y="710" class="ink" font-size="18">SOURCE TRACING</text>
  <text x="298" y="710" class="quiet" font-size="18">Original passages remain attached to the answer</text>
  <text x="80" y="753" class="quiet" font-size="16">Text-based English PDFs. English extraction and Korean translation with source tracing.</text>
</svg>
