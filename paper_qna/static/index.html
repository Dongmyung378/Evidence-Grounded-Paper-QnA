<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evidence Grounded Paper Q&amp;A</title>
  <style>
    :root {
      --primary: #002147;
      --primary-dark: #001633;
      --primary-soft: #EAF0F7;
      --gold: #C28E0E;
      --yellow: #E8B923;
      --yellow-soft: #FCF5DC;
      --yellow-hl: #F6D86B;
      --danger: #A62B3A;
      --danger-soft: #FBECEE;
      --purple: #5C3A8C;
      --purple-soft: #F2EDFA;
      --indigo: #244C82;
      --indigo-soft: #EAF1FA;
      --bg: #FAF7F0;
      --card: #FFFFFF;
      --ink: #132234;
      --muted: #586778;
      --rule: #E4DFCF;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif;
      line-height: 1.6;
      font-variant-numeric: tabular-nums;
    }
    .topbar { height: 5px; background: linear-gradient(90deg, var(--primary) 0%, #1B4272 52%, var(--yellow) 100%); }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 20px 48px; }

    header {
      display: flex; justify-content: space-between; align-items: center; gap: 14px;
      padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--rule);
      flex-wrap: wrap;
    }
    .brand h1 { margin: 0; font-size: 21px; font-weight: 760; letter-spacing: -0.02em; color: var(--primary); }
    .brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    .head-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px;
      background: var(--card); border: 1px solid var(--rule); border-radius: 999px;
      font-size: 12.2px; font-weight: 600; color: var(--ink);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #94A3B8; flex-shrink: 0; }
    .dot.ok { background: #1B8754; }
    .dot.warn { background: var(--yellow); }

    .lang-toggle {
      display: inline-flex; border: 1px solid var(--rule); border-radius: 8px;
      overflow: hidden; background: var(--card);
    }
    .lang-toggle button {
      border: 0; background: transparent; padding: 6px 12px; font-size: 12.2px; font-weight: 700;
      cursor: pointer; color: var(--muted);
    }
    .lang-toggle button.active { background: var(--primary); color: #FFF8DC; }

    .layout {
      display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start;
    }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

    .card {
      background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius);
      padding: 18px 20px; box-shadow: 0 1px 3px rgba(0, 33, 71, 0.05);
    }
    .sec-title {
      font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.02em;
      margin: 0 0 6px; display: flex; align-items: center; justify-content: space-between;
    }
    .field { margin-bottom: 13px; }
    select, textarea {
      width: 100%; border: 1px solid var(--rule); border-radius: 9px; padding: 9px 11px;
      font-size: 13.4px; font-family: inherit; color: var(--ink); background: #fff;
      transition: border-color .15s;
    }
    select:focus, textarea:focus { outline: none; border-color: var(--yellow); box-shadow: 0 0 0 2px rgba(232, 185, 35, 0.22); }
    textarea { min-height: 86px; resize: vertical; line-height: 1.5; }

    .upload-row {
      display: flex; align-items: center; gap: 8px; margin-top: 7px;
    }
    .upload-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
      border: 1px dashed #CFA42B; border-radius: 8px; background: var(--yellow-soft);
      font-size: 12.2px; font-weight: 700; color: #7C5B00; cursor: pointer;
      white-space: nowrap;
    }
    .upload-btn:hover { background: #F8ECC2; border-color: var(--gold); }
    #pdf-file { display: none; }
    #upload-status { font-size: 11.8px; color: var(--gold); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btn-primary {
      width: 100%; border: 0; border-radius: 9px; padding: 11px 16px;
      background: var(--yellow); color: var(--primary); font-size: 14px; font-weight: 780; cursor: pointer;
      transition: background .15s, transform .08s;
      box-shadow: 0 1px 2px rgba(0, 33, 71, 0.10);
    }
    .btn-primary:hover { background: #DBA914; }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; }

    details.gate-drawer {
      margin-top: 14px; border: 1px solid var(--rule); border-radius: 10px;
      background: #FDFCF7; padding: 9px 12px;
    }
    details.gate-drawer summary {
      cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--primary);
      list-style: none; display: flex; align-items: center; justify-content: space-between;
    }
    details.gate-drawer summary::-webkit-details-marker { display: none; }
    details.gate-drawer summary::after { content: "▾"; color: var(--gold); font-size: 12px; }
    details.gate-drawer[open] summary::after { content: "▴"; }
    .gate-body { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; }
    .gate-row label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .gate-row input[type="range"] { accent-color: var(--gold); }
    .check-row {
      display: flex; align-items: center; gap: 7px; font-size: 12.2px; color: var(--ink); cursor: pointer;
    }
    .check-row input { accent-color: var(--primary); cursor: pointer; margin: 0; }

    .presets-wrap { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule); }
    .filter-tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
    .tab-btn {
      border: 1px solid var(--rule); background: #fff; color: var(--muted);
      border-radius: 999px; padding: 3px 9px; font-size: 11.4px; font-weight: 700; cursor: pointer;
    }
    .tab-btn.active { background: var(--primary); color: #FFF8DC; border-color: var(--primary); }
    .preset-list { display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; padding-right: 3px; }
    .preset-item {
      text-align: left; border: 1px solid var(--rule); background: #FDFCF9; border-radius: 9px;
      padding: 8px 10px; cursor: pointer; transition: border-color .15s, background .15s;
    }
    .preset-item:hover, .preset-item.active { border-color: var(--yellow); background: var(--yellow-soft); }
    .preset-meta { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
    .preset-q { font-size: 12.4px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.42; }

    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 10.8px; font-weight: 700;
      white-space: nowrap; flex-shrink: 0;
    }
    .b-ans { background: var(--primary-soft); color: var(--primary); }
    .b-fp { background: var(--danger-soft); color: var(--danger); }
    .b-unsup { background: var(--yellow-soft); color: #8A6200; }
    .b-bnli { background: var(--purple-soft); color: var(--purple); }
    .b-bconf { background: var(--indigo-soft); color: var(--indigo); }
    .b-lang { background: #EEF1F5; color: #3D4E63; }

    /* Right result panel */
    .result-head {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
      padding-bottom: 13px; margin-bottom: 15px; border-bottom: 1px solid var(--rule);
    }
    .verdict-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .verdict-pill {
      padding: 4px 11px; border-radius: 999px; font-size: 12.2px; font-weight: 760;
      white-space: nowrap;
    }
    .verdict-pill.sufficient { background: var(--yellow-soft); color: #7A5600; border: 1px solid #EBD07D; }
    .verdict-pill.contradicted { background: var(--danger-soft); color: var(--danger); }
    .verdict-pill.insufficient { background: var(--primary-soft); color: var(--primary); }
    .paper-caption { margin: 5px 0 0; font-size: 12.6px; color: var(--muted); }
    .latency-chip { font-size: 12px; color: var(--muted); white-space: nowrap; padding-top: 3px; }

    .answer-body {
      font-size: 15.2px; line-height: 1.7; color: var(--ink);
      padding: 15px 18px; border-radius: 10px; background: #FDFCF7;
      border-left: 4px solid var(--yellow); margin-bottom: 16px;
    }
    .answer-body.refused { border-left-color: var(--danger); background: #FDF7F8; }
    .answer-reason { margin-top: 8px; font-size: 13px; color: var(--muted); }

    .metrics-bar {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px;
    }
    @media (max-width: 640px) { .metrics-bar { grid-template-columns: 1fr; } }
    .m-card {
      border: 1px solid var(--rule); border-radius: 10px; padding: 10px 13px; background: #fff;
    }
    .m-top { display: flex; align-items: center; justify-content: space-between; font-size: 11.4px; font-weight: 700; color: var(--muted); }
    .m-val { font-size: 17px; font-weight: 780; margin-top: 3px; color: var(--primary); }
    .m-sub { font-size: 11.4px; color: var(--muted); margin-top: 2px; }
    .mini-bar { position: relative; height: 6px; border-radius: 999px; background: #EDE8D8; margin-top: 7px; }
    .mini-fill { height: 100%; border-radius: 999px; transition: width .2s ease; }
    .mini-thr { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--primary); }

    .sources-title { font-size: 13px; font-weight: 750; color: var(--primary); margin: 0 0 10px; }
    .source-card {
      border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px;
      margin-bottom: 10px; background: #fff;
    }
    .source-top {
      display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
      font-size: 12px; color: var(--muted); margin-bottom: 7px;
    }
    .source-quote {
      margin: 0; padding: 8px 11px; border-radius: 8px; background: var(--yellow-soft);
      border-left: 3px solid var(--yellow);
      font-size: 12.6px; color: #4A3600; line-height: 1.55;
    }
    details.full-passage { margin-top: 8px; }
    details.full-passage summary {
      cursor: pointer; font-size: 12px; font-weight: 700; color: var(--primary);
      user-select: none;
    }
    .passage-text {
      margin-top: 7px; padding-top: 8px; border-top: 1px solid var(--rule);
      font-size: 12.4px; color: #314052; line-height: 1.62;
    }
    mark.hl { background: var(--yellow-hl); color: var(--primary); padding: 1px 3px; border-radius: 3px; }
    .empty-state { padding: 56px 20px; text-align: center; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="topbar"></div>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1 data-i18n="title">논문 질의응답 · 근거 추적</h1>
        <p data-i18n="subtitle">영문 논문 PDF에 한국어 또는 영어로 질문하고 원문 인용과 거짓전제를 검증합니다.</p>
      </div>
      <div class="head-right">
        <span class="status-pill" id="llm-pill"><span class="dot"></span><span>...</span></span>
        <div class="lang-toggle" role="group" aria-label="UI language">
          <button id="btn-ko" class="active" type="button">한국어</button>
          <button id="btn-en" type="button">English</button>
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="card">
        <div class="field">
          <div class="sec-title">
            <span data-i18n="paper_label">논문 선택</span>
            <span id="paper-count" style="font-weight:600"></span>
          </div>
          <select id="paper-select"></select>
          <div class="upload-row">
            <label for="pdf-file" class="upload-btn" data-i18n="upload_btn">+ 영문 PDF 업로드</label>
            <input type="file" id="pdf-file" accept=".pdf,application/pdf" />
            <span id="upload-status"></span>
          </div>
        </div>

        <div class="field">
          <div class="sec-title"><span data-i18n="question_label">질문</span></div>
          <textarea id="question-input"></textarea>
        </div>

        <button class="btn-primary" id="run-btn" type="button" data-i18n="run_btn">질문하기</button>

        <details class="gate-drawer" id="gate-drawer">
          <summary id="gate-summary">게이트 설정 (NLI 0.95 · α=0.05)</summary>
          <div class="gate-body">
            <div class="gate-row">
              <label for="nli-thr">
                <span data-i18n="nli_thr_label">NLI 모순 차단 기준</span>
                <strong id="nli-thr-val">0.95</strong>
              </label>
              <input type="range" id="nli-thr" min="0.50" max="0.99" step="0.01" value="0.95" style="width:100%" />
            </div>
            <div class="gate-row">
              <label for="alpha-sel" data-i18n="alpha_label">Conformal 허용 위험 α</label>
              <select id="alpha-sel">
                <option value="0.02" data-i18n-opt="alpha_02">α = 0.02 (엄격 · 임계 0.899)</option>
                <option value="0.05" selected data-i18n-opt="alpha_05">α = 0.05 (권장 · 임계 0.873)</option>
                <option value="0.10" data-i18n-opt="alpha_10">α = 0.10 (관대 · 임계 0.420)</option>
              </select>
            </div>
            <label class="check-row">
              <input type="checkbox" id="enforce-conformal" />
              <span data-i18n="enforce_conf_label">Conformal 기준 미달 시 답변 보류</span>
            </label>
          </div>
        </details>

        <div class="presets-wrap">
          <div class="sec-title">
            <span data-i18n="presets_title">검증 프리셋</span>
            <span id="preset-count"></span>
          </div>
          <div class="filter-tabs" id="filter-tabs"></div>
          <div class="preset-list" id="preset-grid"></div>
        </div>
      </aside>

      <main class="card" id="result-panel">
        <div class="empty-state" data-i18n="empty">
          논문을 선택하고 질문을 입력하거나, 왼쪽 프리셋을 눌러 결과를 확인하세요.
        </div>
      </main>
    </div>
  </div>

<script>
const I18N = {
  ko: {
    title: '논문 질의응답 · 근거 추적',
    subtitle: '영문 논문 PDF에 한국어 또는 영어로 질문하고 원문 인용과 거짓전제를 검증합니다.',
    paper_label: '논문 선택',
    papers_count: n => `${n}편`,
    upload_btn: '+ 영문 PDF 업로드',
    question_label: '질문',
    question_placeholder: '논문 내용에 대해 한국어 또는 영어로 질문하세요... (Ctrl+Enter 실행)',
    run_btn: '질문하기',
    running: '답변 생성 및 검증 중...',
    gate_summary: (thr, a, enf) => `게이트 설정 (NLI ${thr} · α=${a}${enf ? ' · 보류 켜짐' : ''})`,
    nli_thr_label: 'NLI 모순 차단 기준',
    alpha_label: 'Conformal 허용 위험 α',
    alpha_02: 'α = 0.02 (엄격 · 임계 0.899)',
    alpha_05: 'α = 0.05 (권장 · 임계 0.873)',
    alpha_10: 'α = 0.10 (관대 · 임계 0.420)',
    enforce_conf_label: 'Conformal 기준 미달 시 답변 보류',
    presets_title: 'Holdout 검증 프리셋',
    presets_count: n => `${n}건`,
    tabs: [
      { id: 'all', label: '전체' },
      { id: 'ans', label: '정답' },
      { id: 'border', label: '경계' },
      { id: 'fp', label: '거짓전제' },
      { id: 'unsup', label: '근거부족' },
    ],
    cat: {
      ans: '정답가능',
      borderline_nli: 'NLI 경계',
      borderline_conf: 'Conformal 경계',
      fp: '거짓전제',
      unsup: '근거부족',
    },
    pill_live: m => `로컬 GPU 연결됨 · ${m}`,
    pill_replay: '검증 프리셋 · 발췌 모드',
    v_suff: '검증 완료',
    v_fp: '거짓전제 차단',
    v_conf: '신뢰도 보류',
    v_insuff: '근거 부족',
    mode_live: '실시간 LLM',
    mode_replay: 'Holdout 검증',
    mode_extract: '원문 발췌',
    m_nli: 'NLI 모순 확률',
    m_nli_off: '미적용',
    m_nli_off_sub: '새 PDF 기본 모드',
    m_nli_sub: thr => `차단 기준 ${thr}%`,
    m_conf: 'Conformal 신뢰도',
    conf_pass: '통과',
    conf_hold: '미달',
    m_qn: '인용 · 수치 검증',
    m_qn_sub: '원문 대조 일치율',
    reason_prefix: '사유: ',
    sources_cited: n => `인용된 논문 근거 (${n})`,
    sources_retrieved: '검색된 논문 문단',
    quote_ok: '인용 일치',
    quote_chk: '확인 필요',
    num_ok: '수치 일치',
    num_bad: '수치 불일치',
    show_passage: '원문 문단 펼치기',
    parsing_pdf: 'PDF 파싱 중...',
    upload_ok: d => `등록 완료 (${d.page_count}p)`,
    empty: '논문을 선택하고 질문을 입력하거나, 왼쪽 프리셋을 눌러 결과를 확인하세요.',
  },
  en: {
    title: 'Paper Q&A · Grounded Verification',
    subtitle: 'Ask English or Korean questions on an English paper PDF with verbatim citations and premise checks.',
    paper_label: 'Paper',
    papers_count: n => `${n} loaded`,
    upload_btn: '+ Upload PDF',
    question_label: 'Question',
    question_placeholder: 'Ask a question in English or Korean... (Ctrl+Enter to run)',
    run_btn: 'Ask',
    running: 'Verifying and generating...',
    gate_summary: (thr, a, enf) => `Gate Settings (NLI ${thr} · α=${a}${enf ? ' · Hold ON' : ''})`,
    nli_thr_label: 'NLI Contradiction Threshold',
    alpha_label: 'Conformal Risk α',
    alpha_02: 'α = 0.02 (Strict · thr 0.899)',
    alpha_05: 'α = 0.05 (Default · thr 0.873)',
    alpha_10: 'α = 0.10 (Relaxed · thr 0.420)',
    enforce_conf_label: 'Hold answer when below Conformal threshold',
    presets_title: 'Holdout Presets',
    presets_count: n => `${n} cases`,
    tabs: [
      { id: 'all', label: 'All' },
      { id: 'ans', label: 'Answerable' },
      { id: 'border', label: 'Borderline' },
      { id: 'fp', label: 'False Premise' },
      { id: 'unsup', label: 'Unsupported' },
    ],
    cat: {
      ans: 'Answerable',
      borderline_nli: 'NLI Borderline',
      borderline_conf: 'Conformal Borderline',
      fp: 'False Premise',
      unsup: 'Unsupported',
    },
    pill_live: m => `Local GPU Live · ${m}`,
    pill_replay: 'Holdout Verified · Extractive',
    v_suff: 'Verified Answer',
    v_fp: 'False Premise Blocked',
    v_conf: 'Held by Conformal Gate',
    v_insuff: 'Insufficient Evidence',
    mode_live: 'Live LLM',
    mode_replay: 'Verified Holdout',
    mode_extract: 'Extractive',
    m_nli: 'NLI Contradiction',
    m_nli_off: 'Off',
    m_nli_off_sub: 'Uploaded PDF mode',
    m_nli_sub: thr => `Gate >= ${thr}%`,
    m_conf: 'Conformal Confidence',
    conf_pass: 'PASS',
    conf_hold: 'HOLD',
    m_qn: 'Quote · Numeric',
    m_qn_sub: 'Source match rate',
    reason_prefix: 'Reason: ',
    sources_cited: n => `Cited Evidence (${n})`,
    sources_retrieved: 'Retrieved Passages',
    quote_ok: 'Quote OK',
    quote_chk: 'Check',
    num_ok: 'Numeric OK',
    num_bad: 'Mismatch',
    show_passage: 'Show full passage',
    parsing_pdf: 'Parsing PDF...',
    upload_ok: d => `Loaded (${d.page_count}p)`,
    empty: 'Select a paper and ask a question, or click a Holdout preset on the left.',
  }
};

const urlParams = new URLSearchParams(window.location.search);
let uiLang = urlParams.get('lang') === 'en' ? 'en' : 'ko';
let statusCache = null;
let presetsCache = [];
let activeFilter = 'all';
let activePresetId = null;
let lastResult = null;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function catClass(cat) {
  if (cat === 'ans') return 'b-ans';
  if (cat === 'borderline_nli') return 'b-bnli';
  if (cat === 'borderline_conf') return 'b-bconf';
  if (cat === 'fp') return 'b-fp';
  return 'b-unsup';
}

function shortModelName(name) {
  if (!name) return 'Qwen3-4B';
  const last = String(name).split('/').pop();
  return last.split(':')[0].replace(/-GGUF$/i, '');
}

function formatTime(ms) {
  const n = Number(ms || 0);
  if (n >= 1000) return `${(n / 1000).toFixed(2)}s`;
  return `${n.toFixed(1)} ms`;
}

function highlightQuote(text, quotes) {
  let html = esc(text);
  for (const q of quotes) {
    if (!q || q.length < 10) continue;
    const escapedQ = esc(q.trim());
    const idx = html.toLowerCase().indexOf(escapedQ.toLowerCase());
    if (idx !== -1) {
      html = html.slice(0, idx) + '<mark class="hl">' + html.slice(idx, idx + escapedQ.length) + '</mark>' + html.slice(idx + escapedQ.length);
    }
  }
  return html;
}

function updateGateSummary() {
  const t = I18N[uiLang];
  const thr = Number(document.getElementById('nli-thr').value).toFixed(2);
  const a = document.getElementById('alpha-sel').value;
  const enf = document.getElementById('enforce-conformal').checked;
  document.getElementById('nli-thr-val').textContent = thr;
  document.getElementById('gate-summary').textContent = t.gate_summary(thr, a, enf);
}

function renderStatus() {
  if (!statusCache) return;
  const t = I18N[uiLang];
  const pill = document.getElementById('llm-pill');
  const live = statusCache.llm && statusCache.llm.connected;
  pill.innerHTML = `<span class="dot ${live ? 'ok' : 'warn'}"></span><span>${esc(live ? t.pill_live(shortModelName(statusCache.llm.model)) : t.pill_replay)}</span>`;
  document.getElementById('paper-count').textContent = t.papers_count(statusCache.papers_loaded);
}

function renderTabs() {
  const t = I18N[uiLang];
  const wrap = document.getElementById('filter-tabs');
  wrap.innerHTML = t.tabs.map(tb =>
    `<button type="button" class="tab-btn ${activeFilter === tb.id ? 'active' : ''}" data-tab="${tb.id}">${esc(tb.label)}</button>`
  ).join('');
  wrap.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.tab;
      renderTabs();
      renderPresets();
    });
  });
}

function renderPresets() {
  const t = I18N[uiLang];
  const filtered = presetsCache.filter(p => {
    if (activeFilter === 'all') return true;
    if (activeFilter === 'border') return p.category === 'borderline_nli' || p.category === 'borderline_conf';
    return p.category === activeFilter;
  });
  document.getElementById('preset-count').textContent = t.presets_count(filtered.length);
  const grid = document.getElementById('preset-grid');
  grid.innerHTML = filtered.map(p => `
    <button type="button" class="preset-item ${activePresetId === p.id ? 'active' : ''}" data-pid="${esc(p.id)}">
      <div class="preset-meta">
        <span class="badge ${catClass(p.category)}">${esc(t.cat[p.category] || p.category)}</span>
        <span class="badge b-lang">${esc(p.language.toUpperCase())}</span>
        <span style="font-size:11px;color:var(--muted)">${esc(p.paper_id)}</span>
      </div>
      <div class="preset-q">${esc(p.question)}</div>
    </button>`).join('');
  grid.querySelectorAll('.preset-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = presetsCache.find(x => x.id === btn.dataset.pid);
      if (!p) return;
      activePresetId = p.id;
      document.getElementById('paper-select').value = p.paper_id;
      document.getElementById('question-input').value = p.question;
      if (p.category === 'borderline_nli' || p.category === 'borderline_conf') {
        document.getElementById('gate-drawer').open = true;
      }
      renderPresets();
      runAsk();
    });
  });
}

function applyLang() {
  const t = I18N[uiLang];
  document.documentElement.lang = uiLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (typeof t[k] === 'string') el.textContent = t[k];
  });
  document.querySelectorAll('[data-i18n-opt]').forEach(opt => {
    const k = opt.getAttribute('data-i18n-opt');
    if (typeof t[k] === 'string') opt.textContent = t[k];
  });
  document.getElementById('question-input').placeholder = t.question_placeholder;
  document.getElementById('btn-ko').classList.toggle('active', uiLang === 'ko');
  document.getElementById('btn-en').classList.toggle('active', uiLang === 'en');
  updateGateSummary();
  renderStatus();
  renderTabs();
  renderPresets();
  if (lastResult) renderResult(lastResult);
}

function renderResult(data) {
  lastResult = data;
  const t = I18N[uiLang];
  const resp = data.response;
  const pipe = data.pipeline || {};
  const nli = data.nli || {};
  const conf = data.conformal || {};
  const isSuff = resp.sufficiency === 'sufficient';
  const isConfBlocked = pipe.abstention_source === 'conformal_gate_blocked' || conf.blocked;
  const isFP = nli.triggered || pipe.abstention_source === 'scientific_nli_contradiction' || pipe.abstention_source === 'llm_contradicted';
  const vClass = isSuff ? 'sufficient' : (isFP ? 'contradicted' : 'insufficient');
  const vLabel = isSuff ? t.v_suff : (isConfBlocked ? t.v_conf : (isFP ? t.v_fp : t.v_insuff));

  const gmode = String(pipe.generation_mode || '');
  const modeTag = gmode.startsWith('live_llm')
    ? t.mode_live
    : (gmode.startsWith('verified_holdout') ? t.mode_replay : (gmode.startsWith('extractive') ? t.mode_extract : ''));

  const nliDisabled = nli.engine === 'disabled';
  const contraPct = Math.round((nli.max_contra || 0) * 1000) / 10;
  const thrPct = Math.round((nli.threshold || 0.95) * 100);
  const nliColor = (nli.max_contra || 0) >= (nli.threshold || 0.95) ? 'var(--danger)' : ((nli.max_contra || 0) >= 0.4 ? 'var(--gold)' : 'var(--primary)');

  const confBadge = conf.accepted !== undefined
    ? `<span class="badge ${conf.accepted ? 'b-ans' : 'b-unsup'}">${esc(conf.accepted ? t.conf_pass : t.conf_hold)}</span>`
    : '';

  // Group alignment quotes by evidence_id so each source card appears once without repeating the whole answer
  const evMap = {};
  (data.retrieved_evidence || []).forEach(e => { evMap[e.evidence_id] = e; });
  (data.cited_evidence || []).forEach(e => { evMap[e.evidence_id] = e; });

  const alignments = data.answer_alignment || [];
  let sourcesHtml = '';
  if (alignments.length > 0) {
    const grouped = [];
    const byId = {};
    alignments.forEach(al => {
      if (!byId[al.evidence_id]) {
        byId[al.evidence_id] = { ev: evMap[al.evidence_id], items: [] };
        grouped.push(byId[al.evidence_id]);
      }
      byId[al.evidence_id].items.push(al);
    });
    sourcesHtml = `
      <div class="sources-title">${esc(t.sources_cited(grouped.length))}</div>
      ${grouped.map(g => {
        const first = g.items[0];
        const quotes = g.items.map(it => it.verbatim_quote).filter(Boolean);
        const allQ = g.items.every(it => it.quote_verified);
        const allN = g.items.every(it => it.numeric_verified);
        return `
          <div class="source-card">
            <div class="source-top">
              <strong style="color:var(--primary)">p.${first.page} · ${esc(first.section)}</strong>
              <span class="badge ${allQ ? 'b-ans' : 'b-unsup'}">${esc(allQ ? t.quote_ok : t.quote_chk)}</span>
              <span class="badge ${allN ? 'b-ans' : 'b-fp'}">${esc(allN ? t.num_ok : t.num_bad)}</span>
            </div>
            ${quotes.map(q => `<blockquote class="source-quote">"${esc(q)}"</blockquote>`).join('<div style="height:6px"></div>')}
            ${g.ev ? `
              <details class="full-passage">
                <summary>${esc(t.show_passage)}</summary>
                <div class="passage-text">${highlightQuote(g.ev.text, quotes)}</div>
              </details>` : ''}
          </div>`;
      }).join('')}`;
  } else if ((data.retrieved_evidence || []).length > 0) {
    const topEv = (data.retrieved_evidence || []).slice(0, 2);
    sourcesHtml = `
      <div class="sources-title">${esc(t.sources_retrieved)}</div>
      ${topEv.map(ev => `
        <div class="source-card">
          <div class="source-top">
            <strong style="color:var(--primary)">p.${ev.page} · ${esc(ev.section)}</strong>
          </div>
          <details class="full-passage">
            <summary>${esc(t.show_passage)}</summary>
            <div class="passage-text">${esc(ev.text)}</div>
          </details>
        </div>`).join('')}`;
  }

  document.getElementById('result-panel').innerHTML = `
    <div class="result-head">
      <div>
        <div class="verdict-row">
          <span class="verdict-pill ${vClass}">${esc(vLabel)}</span>
          ${modeTag ? `<span class="badge b-lang">${esc(modeTag)}</span>` : ''}
        </div>
        <p class="paper-caption">${esc(data.paper.title)}</p>
      </div>
      <div class="latency-chip">${esc(formatTime(pipe.wall_ms))}</div>
    </div>

    <div class="answer-body ${isSuff ? '' : 'refused'}">
      <div>${esc(resp.answer)}</div>
      ${resp.abstention_reason ? `<div class="answer-reason"><strong>${esc(t.reason_prefix)}</strong>${esc(resp.abstention_reason)}</div>` : ''}
    </div>

    <div class="metrics-bar">
      <div class="m-card">
        <div class="m-top"><span>${esc(t.m_nli)}</span></div>
        <div class="m-val" style="color:${nliDisabled ? 'var(--muted)' : nliColor}">${nliDisabled ? esc(t.m_nli_off) : `${contraPct.toFixed(1)}%`}</div>
        ${nliDisabled
          ? `<div class="m-sub">${esc(t.m_nli_off_sub)}</div>`
          : `<div class="mini-bar"><div class="mini-fill" style="width:${Math.min(100, contraPct)}%;background:${nliColor}"></div><div class="mini-thr" style="left:${thrPct}%"></div></div>
             <div class="m-sub">${esc(t.m_nli_sub(thrPct))}</div>`}
      </div>
      <div class="m-card">
        <div class="m-top"><span>${esc(t.m_conf)}</span>${confBadge}</div>
        <div class="m-val" style="color:${conf.accepted === false ? 'var(--gold)' : 'var(--primary)'}">${conf.probability !== undefined ? conf.probability.toFixed(3) : 'N/A'}</div>
        <div class="m-sub">α=${conf.alpha ?? 0.05} · thr=${conf.threshold !== undefined ? conf.threshold.toFixed(3) : 'N/A'}</div>
      </div>
      <div class="m-card">
        <div class="m-top"><span>${esc(t.m_qn)}</span></div>
        <div class="m-val">${Math.round((pipe.quote_verified_ratio ?? 0)*100)}% / ${Math.round((pipe.numeric_verified_ratio ?? 0)*100)}%</div>
        <div class="m-sub">${esc(t.m_qn_sub)}</div>
      </div>
    </div>

    ${sourcesHtml}
  `;
}

async function runAsk() {
  const btn = document.getElementById('run-btn');
  const paperId = document.getElementById('paper-select').value;
  const question = document.getElementById('question-input').value.trim();
  if (!paperId || !question) return;
  btn.disabled = true;
  btn.textContent = I18N[uiLang].running;
  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        paper_id: paperId,
        question,
        nli_threshold: parseFloat(document.getElementById('nli-thr').value),
        conformal_alpha: parseFloat(document.getElementById('alpha-sel').value),
        enforce_conformal: document.getElementById('enforce-conformal').checked,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Request failed');
    renderResult(data);
  } catch (err) {
    document.getElementById('result-panel').innerHTML = `<div class="answer-body refused"><strong>Error:</strong> ${esc(err.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = I18N[uiLang].run_btn;
  }
}

async function bootstrap() {
  const [stRes, pRes, prRes] = await Promise.all([fetch('/api/status'), fetch('/api/papers'), fetch('/api/presets')]);
  statusCache = await stRes.json();
  const papersData = await pRes.json();
  const presetsData = await prRes.json();

  const sel = document.getElementById('paper-select');
  sel.innerHTML = papersData.papers.map(p => `<option value="${esc(p.paper_id)}">[${esc(p.paper_id)}] ${esc(p.title.slice(0, 64))} (${p.page_count}p)</option>`).join('');

  presetsCache = presetsData.presets || [];
  applyLang();

  if (presetsCache.length > 0) {
    const preferred = presetsCache.find(p => p.category === 'ans' && p.language === uiLang) || presetsCache[0];
    activePresetId = preferred.id;
    sel.value = preferred.paper_id;
    document.getElementById('question-input').value = preferred.question;
    renderPresets();
    await runAsk();
  }
}

document.getElementById('btn-ko').addEventListener('click', () => { uiLang = 'ko'; applyLang(); });
document.getElementById('btn-en').addEventListener('click', () => { uiLang = 'en'; applyLang(); });
document.getElementById('nli-thr').addEventListener('input', updateGateSummary);
document.getElementById('nli-thr').addEventListener('change', () => { updateGateSummary(); if (lastResult) runAsk(); });
document.getElementById('alpha-sel').addEventListener('change', () => { updateGateSummary(); if (lastResult) runAsk(); });
document.getElementById('enforce-conformal').addEventListener('change', () => { updateGateSummary(); if (lastResult) runAsk(); });
document.getElementById('run-btn').addEventListener('click', runAsk);
document.getElementById('question-input').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runAsk(); }
});
document.getElementById('pdf-file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  const st = document.getElementById('upload-status');
  st.style.color = 'var(--gold)';
  st.textContent = I18N[uiLang].parsing_pdf;
  const fd = new FormData();
  fd.append('file', f);
  const res = await fetch('/api/upload', { method: 'POST', body: fd });
  const data = await res.json();
  if (!res.ok) { st.style.color = 'var(--danger)'; st.textContent = data.detail || 'Upload failed'; return; }
  st.textContent = I18N[uiLang].upload_ok(data);
  const sel = document.getElementById('paper-select');
  const opt = document.createElement('option');
  opt.value = data.paper_id;
  opt.textContent = `[PDF] ${data.title.slice(0, 64)} (${data.page_count}p)`;
  sel.prepend(opt);
  sel.value = data.paper_id;
  activePresetId = null;
  renderPresets();
});

bootstrap();
</script>
</body>
</html>
