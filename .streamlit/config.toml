[server]
headless = true
# The UI enforces the 20 MiB product limit before calling FastAPI.
# This slightly higher transport ceiling lets the UI show its localized message.
maxUploadSize = 21

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2557A7"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#172033"
font = "sans serif"
